name: "kdongs-dev"

services:
  kdongs-pgsql:
    image: postgres:18-alpine
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'kdongs-pgsql-volume:/var/lib/postgresql'
    networks:
      - kdongs-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
      retries: 3
      timeout: 15s

  kdongs-redis:
    image: redis:alpine
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'kdongs-redis-volume:/data'
    networks:
      - kdongs-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      retries: 3
      timeout: 15s

  kdongs-mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_HTTP_PORT:-8025}:8025'
    networks:
      - kdongs-network

networks:
  kdongs-network:
    driver: bridge

volumes:
  kdongs-pgsql-volume:
  kdongs-redis-volume:
